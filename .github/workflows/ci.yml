name: Dashboard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governed-proxy-tests:
    name: Governed proxy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run governed proxy tests
        run: python -m pytest -q tests/test_governed_forecast_proxy.py

  frontend-test-build:
    name: Official Forecast tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Official Forecast tests
        run: npm run test:official-forecast
      - name: Build frontend
        run: npm run build
